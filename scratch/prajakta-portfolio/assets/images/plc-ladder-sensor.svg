<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ldrBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="650" height="280" rx="8" fill="url(#ldrBg3)" stroke="#334155" stroke-width="1.5" />

  <line x1="40" y1="30" x2="40" y2="250" stroke="#0284c7" stroke-width="4" />
  <line x1="610" y1="30" x2="610" y2="250" stroke="#0284c7" stroke-width="4" />
  <text x="40" y="22" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">+24V</text>
  <text x="610" y="22" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0V</text>

  <!-- Rung 0003 -->
  <rect x="5" y="80" width="30" height="18" rx="2" fill="#1e293b"/>
  <text x="20" y="93" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">0003</text>

  <!-- Input Proximity Sensor Contact -->
  <line x1="40" y1="90" x2="120" y2="90" stroke="#38bdf8" stroke-width="2" />
  <g transform="translate(120, 90)">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#f8fafc" stroke-width="2.5" />
    <line x1="20" y1="-18" x2="20" y2="18" stroke="#f8fafc" stroke-width="2.5" />
    <line x1="20" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="2" />
    <text x="10" y="-24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">I0.4</text>
    <text x="10" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">PROX_SENSOR</text>
  </g>

  <!-- Up Counter Block (CTU) -->
  <g transform="translate(200, 45)">
    <rect x="0" y="0" width="160" height="90" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="22" fill="#34d399" font-family="'Segoe UI', monospace" font-size="12" font-weight="700" text-anchor="middle">CTU (C5:0)</text>
    <text x="80" y="36" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">COUNT UP COUNTER</text>
    
    <text x="15" y="56" fill="#cbd5e1" font-family="monospace" font-size="10">Preset (PV):</text>
    <text x="145" y="56" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">10 PARTS</text>
    <text x="15" y="74" fill="#cbd5e1" font-family="monospace" font-size="10">Accum (CV):</text>
    <text x="145" y="74" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">0 PARTS</text>
  </g>

  <!-- Output wire to Done bit -->
  <line x1="360" y1="90" x2="480" y2="90" stroke="#38bdf8" stroke-width="2" />

  <g transform="translate(480, 90)">
    <path d="M 10 -20 C 0 -10, 0 10, 10 20" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <path d="M 35 -20 C 45 -10, 45 10, 35 20" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <line x1="0" y1="0" x2="5" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="40" y1="0" x2="130" y2="0" stroke="#38bdf8" stroke-width="2" />
    <circle cx="22" cy="0" r="4" fill="#10b981" />
    <text x="22" y="-24" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">( C5:0/DN )</text>
    <text x="22" y="32" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">BATCH_COMPLETE</text>
  </g>

  <!-- Rung 0004: Diverter Actuator Coil -->
  <rect x="5" y="170" width="30" height="18" rx="2" fill="#1e293b"/>
  <text x="20" y="183" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">0004</text>

  <line x1="40" y1="180" x2="180" y2="180" stroke="#38bdf8" stroke-width="2" />
  <g transform="translate(180, 180)">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#f8fafc" stroke-width="2.5" />
    <line x1="20" y1="-18" x2="20" y2="18" stroke="#f8fafc" stroke-width="2.5" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="2" />
    <text x="10" y="-24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">C5:0/DN</text>
    <text x="10" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">BATCH_REACHED</text>
  </g>

  <g transform="translate(480, 180)">
    <path d="M 10 -20 C 0 -10, 0 10, 10 20" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <path d="M 35 -20 C 45 -10, 45 10, 35 20" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <line x1="0" y1="0" x2="5" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="40" y1="0" x2="130" y2="0" stroke="#38bdf8" stroke-width="2" />
    <circle cx="22" cy="0" r="4" fill="#38bdf8" />
    <text x="22" y="-24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">( Q0.2 )</text>
    <text x="22" y="32" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">CONVEYOR_DIVERTER</text>
  </g>

  <!-- Legend -->
  <text x="325" y="245" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">
    Optical / Inductive Proximity Sensor Part Counting &amp; Batch Routing Automation Logic
  </text>
</svg>
