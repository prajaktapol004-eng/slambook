<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="450" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect width="400" height="450" rx="20" fill="url(#gridPattern)" opacity="0.6" />

  <!-- Industrial Corner Accents -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#38bdf8" stroke-width="3" fill="none" />
  <path d="M 385 35 L 385 15 L 365 15" stroke="#38bdf8" stroke-width="3" fill="none" />
  <path d="M 15 415 L 15 435 L 35 435" stroke="#06b6d4" stroke-width="3" fill="none" />
  <path d="M 385 415 L 385 435 L 365 435" stroke="#06b6d4" stroke-width="3" fill="none" />

  <!-- Technical Circuit Ring -->
  <circle cx="200" cy="180" r="110" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="200" cy="180" r="95" fill="#0f172a" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Engineering Female Silhouette / Portrait Badge -->
  <g transform="translate(140, 110)">
    <!-- Head -->
    <circle cx="60" cy="40" r="32" fill="#38bdf8" opacity="0.85" />
    <!-- Hair / Profile contour -->
    <path d="M 28 38 C 28 10, 92 10, 92 38 C 92 50, 88 64, 88 68 C 76 60, 44 60, 32 68 Z" fill="#0284c7" />
    <!-- Body / Shoulders -->
    <path d="M 15 110 C 15 75, 40 68, 60 68 C 80 68, 105 75, 105 110 Z" fill="#38bdf8" opacity="0.75" />
    <!-- Lab Coat / Tech Collar -->
    <path d="M 46 72 L 60 98 L 74 72" stroke="#0f172a" stroke-width="3" fill="none" />
  </g>

  <!-- Industrial Badges & Status -->
  <g transform="translate(130, 260)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#0369a1" opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="13" r="5" fill="#10b981" />
    <text x="75" y="17" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">PLC &amp; AUTOMATION</text>
  </g>

  <!-- Name & Title on Card -->
  <text x="200" y="325" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">PRAJAKTA POL</text>
  <text x="200" y="350" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" text-anchor="middle">B.Tech E&amp;TC | PGDIA Automation</text>

  <!-- Note for replacement -->
  <rect x="60" y="380" width="280" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  <text x="200" y="396" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">📷 Photo Placeholder</text>
  <text x="200" y="410" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Replace with prajakta-photo.jpg anytime</text>
</svg>
