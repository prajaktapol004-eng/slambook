<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="emGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#emBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="600" height="360" rx="12" fill="url(#emGrid)" opacity="0.4" />

  <!-- Badge -->
  <rect x="25" y="20" width="220" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="37" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">SMART VOLTAGE MONITOR</text>
  <circle cx="230" cy="33" r="4" fill="#10b981"/>

  <!-- AC Mains Source -->
  <g transform="translate(35, 80)">
    <rect x="0" y="20" width="80" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="40" y="45" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">230V AC</text>
    <text x="40" y="60" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">MAINS</text>
    
    <!-- AC Sine Wave -->
    <path d="M 15 100 Q 25 75, 40 100 T 65 100" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <text x="40" y="145" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">50 Hz Line</text>
  </g>

  <!-- Wiring from Mains to ZMPT101B -->
  <path d="M 115 130 H 155" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <path d="M 115 160 H 155" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="135" y="122" fill="#ef4444" font-family="monospace" font-size="9">L</text>
  <text x="135" y="175" fill="#3b82f6" font-family="monospace" font-size="9">N</text>

  <!-- ZMPT101B Voltage Transformer Module -->
  <g transform="translate(155, 70)">
    <rect x="0" y="0" width="120" height="170" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="25" fill="#34d399" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" text-anchor="middle">ZMPT101B</text>
    <text x="60" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Voltage Transformer</text>

    <!-- Blue Transformer Block -->
    <rect x="25" y="55" width="70" height="50" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="85" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ISOLATION</text>

    <!-- Trimmer Potentiometer (Gain Adjust) -->
    <circle cx="45" cy="130" r="12" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <line x1="38" y1="130" x2="52" y2="130" stroke="#f8fafc" stroke-width="2"/>
    <text x="65" y="133" fill="#94a3b8" font-family="sans-serif" font-size="8">Gain Adj</text>
  </g>

  <!-- Trace from ZMPT101B to ESP32 -->
  <path d="M 275 145 H 320" stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="298" y="138" fill="#10b981" font-family="monospace" font-size="8" text-anchor="middle">Analog Out</text>

  <!-- ESP32 Controller -->
  <g transform="translate(320, 75)">
    <rect x="0" y="0" width="115" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="24" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">ESP32</text>
    <text x="57" y="38" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Wi-Fi Controller</text>
    
    <!-- Chip -->
    <rect x="25" y="50" width="65" height="55" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="57" y="75" fill="#e2e8f0" font-family="monospace" font-size="8" text-anchor="middle">True RMS</text>
    <text x="57" y="90" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Sampling</text>

    <!-- Wi-Fi status LED -->
    <circle cx="35" cy="130" r="4" fill="#10b981"/>
    <text x="45" y="133" fill="#cbd5e1" font-family="sans-serif" font-size="8">Wi-Fi Connected</text>
  </g>

  <!-- Wireless Link to Telegram -->
  <path d="M 435 150 C 450 135, 465 135, 475 145" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  <path d="M 440 160 C 452 148, 462 148, 470 156" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Telegram Bot Interface (Smartphone Mockup) -->
  <g transform="translate(475, 55)">
    <rect x="0" y="0" width="105" height="200" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Speaker & Camera -->
    <rect x="35" y="6" width="35" height="3" rx="1.5" fill="#334155"/>
    <!-- App Header -->
    <rect x="4" y="14" width="97" height="24" rx="4" fill="#0284c7"/>
    <text x="52" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Telegram Bot</text>
    
    <!-- Message Bubble 1 -->
    <rect x="8" y="46" width="89" height="55" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="60" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700">⚡ Voltage Alert</text>
    <text x="14" y="74" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="700">V_rms: 232.4 V</text>
    <text x="14" y="88" fill="#10b981" font-family="sans-serif" font-size="7">Status: Nominal (Normal)</text>

    <!-- Message Bubble 2 -->
    <rect x="8" y="110" width="89" height="50" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="124" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700">⚠️ Periodic Report</text>
    <text x="14" y="137" fill="#cbd5e1" font-family="monospace" font-size="8">Freq: 50.0 Hz</text>
    <text x="14" y="149" fill="#94a3b8" font-family="monospace" font-size="7">Grid Line OK</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="315" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11" text-anchor="middle">
    ZMPT101B Galvanic Isolation &bull; ESP32 Continuous ADC Sampling &bull; Telegram Bot API Notifications
  </text>
</svg>
