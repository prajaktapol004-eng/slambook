<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#wqBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="600" height="360" rx="12" fill="url(#pcbGrid)" opacity="0.4" />

  <!-- Title / System Tag -->
  <rect x="25" y="20" width="200" height="26" rx="6" fill="#0369a1" opacity="0.25" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="37" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">IoT WATER MONITORING</text>
  <circle cx="210" cy="33" r="4" fill="#10b981"/>

  <!-- Left: Water Basin / Sensor Probes -->
  <g transform="translate(35, 65)">
    <!-- Water Tank Container -->
    <rect x="0" y="30" width="130" height="220" rx="8" fill="#0c4a6e" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="5" y="80" width="120" height="165" rx="4" fill="#0369a1" fill-opacity="0.15"/>
    <text x="65" y="235" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" font-weight="600">WATER SAMPLE</text>

    <!-- Probe 1: pH Sensor -->
    <rect x="15" y="10" width="18" height="130" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <rect x="18" y="125" width="12" height="25" rx="3" fill="#06b6d4"/>
    <text x="24" y="5" fill="#e2e8f0" font-family="monospace" font-size="9" text-anchor="middle">pH</text>

    <!-- Probe 2: TDS Sensor -->
    <rect x="45" y="20" width="16" height="120" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 49 135 L 49 145 M 57 135 L 57 145" stroke="#e2e8f0" stroke-width="2"/>
    <text x="53" y="15" fill="#e2e8f0" font-family="monospace" font-size="9" text-anchor="middle">TDS</text>

    <!-- Probe 3: Turbidity -->
    <rect x="73" y="15" width="22" height="115" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="84" cy="118" r="6" fill="#f59e0b" fill-opacity="0.7"/>
    <text x="84" y="10" fill="#e2e8f0" font-family="monospace" font-size="8" text-anchor="middle">TURB</text>

    <!-- Probe 4: Temp (DS18B20) -->
    <rect x="104" y="25" width="10" height="110" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="109" cy="130" r="4" fill="#ef4444"/>
    <text x="109" y="18" fill="#e2e8f0" font-family="monospace" font-size="9" text-anchor="middle">°C</text>
  </g>

  <!-- Wiring Traces -->
  <path d="M 175 140 H 220 V 160 H 250" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 175 165 H 230 V 175 H 250" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 175 190 H 220 V 190 H 250" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 175 215 H 210 V 205 H 250" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Center: ESP32 Microcontroller Board -->
  <g transform="translate(250, 95)">
    <!-- PCB Board -->
    <rect x="0" y="0" width="130" height="180" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
    <text x="65" y="22" fill="#5eead4" font-family="'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">ESP-WROOM-32</text>
    
    <!-- SoC Metal Shield -->
    <rect x="35" y="32" width="60" height="60" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="65" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ESP32</text>
    <path d="M 45 42 H 85 M 45 50 H 85 M 45 75 H 85" stroke="#64748b" stroke-width="1"/>

    <!-- Wi-Fi Antenna Trace -->
    <path d="M 45 10 H 52 V 6 H 60 V 10 H 68 V 6 H 76 V 10 H 85" stroke="#f59e0b" stroke-width="2" fill="none"/>
    
    <!-- Pin Headers -->
    <g fill="#e2e8f0">
      <rect x="4" y="30" width="6" height="8" rx="1"/>
      <rect x="4" y="45" width="6" height="8" rx="1"/>
      <rect x="4" y="60" width="6" height="8" rx="1"/>
      <rect x="4" y="75" width="6" height="8" rx="1"/>
      <rect x="4" y="90" width="6" height="8" rx="1"/>
      <rect x="4" y="105" width="6" height="8" rx="1"/>
      <rect x="4" y="120" width="6" height="8" rx="1"/>

      <rect x="120" y="30" width="6" height="8" rx="1"/>
      <rect x="120" y="45" width="6" height="8" rx="1"/>
      <rect x="120" y="60" width="6" height="8" rx="1"/>
      <rect x="120" y="75" width="6" height="8" rx="1"/>
      <rect x="120" y="90" width="6" height="8" rx="1"/>
      <rect x="120" y="105" width="6" height="8" rx="1"/>
      <rect x="120" y="120" width="6" height="8" rx="1"/>
    </g>

    <!-- Status LEDs -->
    <circle cx="35" cy="155" r="3" fill="#ef4444"/>
    <text x="45" y="158" fill="#94a3b8" font-family="monospace" font-size="8">PWR</text>
    <circle cx="80" cy="155" r="3" fill="#10b981"/>
    <text x="90" y="158" fill="#94a3b8" font-family="monospace" font-size="8">WiFi</text>
  </g>

  <!-- Cloud / Wi-Fi Signals -->
  <path d="M 385 160 C 405 140, 420 140, 435 155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
  <path d="M 390 170 C 405 155, 415 155, 430 165" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Right: ThingSpeak Cloud Dashboard -->
  <g transform="translate(435, 75)">
    <!-- Dashboard Frame -->
    <rect x="0" y="0" width="145" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="26" rx="8" fill="#0f172a"/>
    <circle cx="12" cy="13" r="3.5" fill="#ef4444"/>
    <circle cx="23" cy="13" r="3.5" fill="#f59e0b"/>
    <circle cx="34" cy="13" r="3.5" fill="#10b981"/>
    <text x="80" y="17" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">ThingSpeak IoT</text>

    <!-- Metric 1: pH Chart -->
    <rect x="10" y="36" width="125" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="8">pH Level</text>
    <text x="18" y="65" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">7.24</text>
    <path d="M 75 60 Q 90 45, 105 55 T 125 48" stroke="#06b6d4" stroke-width="1.5" fill="none"/>

    <!-- Metric 2: TDS -->
    <rect x="10" y="78" width="125" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="92" fill="#94a3b8" font-family="sans-serif" font-size="8">TDS Value</text>
    <text x="18" y="107" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">248 ppm</text>
    <path d="M 75 102 Q 95 90, 110 98 T 125 94" stroke="#10b981" stroke-width="1.5" fill="none"/>

    <!-- Metric 3: Turbidity & Temp -->
    <rect x="10" y="120" width="125" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="134" fill="#94a3b8" font-family="sans-serif" font-size="8">Turbidity / Temp</text>
    <text x="18" y="151" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">2.1 NTU | 26.5°C</text>

    <!-- Status Bar -->
    <rect x="10" y="172" width="125" height="26" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="72" y="188" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Telemetry: ACTIVE</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="325" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11" text-anchor="middle">
    ESP32 ADC Interface &bull; Real-Time Multi-Parameter Acquisition &bull; REST API / HTTP Telemetry
  </text>
</svg>
