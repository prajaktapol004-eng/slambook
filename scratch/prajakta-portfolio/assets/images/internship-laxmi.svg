<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="panelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#lcBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="600" height="340" rx="12" fill="url(#panelGrid)" opacity="0.4" />

  <!-- Badge -->
  <rect x="25" y="20" width="310" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="37" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">LAXMI CONTROLS &bull; PANEL &amp; AUTOMATION</text>
  <circle cx="320" cy="33" r="4" fill="#10b981"/>

  <!-- Control Panel Enclosure Mockup -->
  <g transform="translate(35, 60)">
    <rect x="0" y="0" width="530" height="215" rx="8" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="15" y="18" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="9" font-weight="700">ELECTRICAL CONTROL PANEL ENCLOSURE (415V / 24VDC)</text>

    <!-- Top DIN Rail -->
    <rect x="15" y="30" width="500" height="8" fill="#64748b" stroke="#94a3b8" stroke-width="0.5"/>
    
    <!-- Top Row Hardware Mounted on DIN Rail -->
    <!-- 1. 3-Phase MCB (Circuit Breaker) -->
    <g transform="translate(30, 42)">
      <rect x="0" y="0" width="48" height="65" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="10" y="8" width="28" height="18" rx="2" fill="#0f172a"/>
      <rect x="18" y="11" width="12" height="12" rx="1" fill="#ef4444"/>
      <text x="24" y="42" fill="#f8fafc" font-family="monospace" font-size="8" text-anchor="middle">3P MCB</text>
      <text x="24" y="55" fill="#f59e0b" font-family="monospace" font-size="7" text-anchor="middle">C16 415V</text>
    </g>

    <!-- 2. SMPS Power Supply (24VDC) -->
    <g transform="translate(90, 42)">
      <rect x="0" y="0" width="65" height="65" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="32" y="20" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="8" font-weight="700" text-anchor="middle">SMPS</text>
      <text x="32" y="33" fill="#e2e8f0" font-family="monospace" font-size="8" text-anchor="middle">24V DC / 5A</text>
      <circle cx="20" cy="50" r="3" fill="#10b981"/>
      <text x="38" y="53" fill="#94a3b8" font-family="monospace" font-size="7">DC OK</text>
    </g>

    <!-- 3. Contactor + Thermal Overload Relay -->
    <g transform="translate(170, 42)">
      <rect x="0" y="0" width="55" height="42" rx="2" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="27" y="18" fill="#22d3ee" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">CONTACTOR</text>
      <text x="27" y="32" fill="#cbd5e1" font-family="monospace" font-size="7" text-anchor="middle">24VDC Coil</text>
      <!-- Overload Relay underneath -->
      <rect x="0" y="44" width="55" height="26" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="27" y="56" fill="#ef4444" font-family="monospace" font-size="7" text-anchor="middle">O/L RELAY</text>
      <circle cx="12" cy="62" r="2.5" fill="#3b82f6"/>
      <circle cx="43" cy="62" r="2.5" fill="#ef4444"/>
    </g>

    <!-- 4. Miniature Control Relays (Finder / Omron style) -->
    <g transform="translate(240, 42)">
      <rect x="0" y="0" width="20" height="65" rx="2" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="35" fill="#f8fafc" font-family="monospace" font-size="6" text-anchor="middle" transform="rotate(-90 10 35)">K1 24V</text>
    </g>
    <g transform="translate(265, 42)">
      <rect x="0" y="0" width="20" height="65" rx="2" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="35" fill="#f8fafc" font-family="monospace" font-size="6" text-anchor="middle" transform="rotate(-90 10 35)">K2 24V</text>
    </g>
    <g transform="translate(290, 42)">
      <rect x="0" y="0" width="20" height="65" rx="2" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="35" fill="#f8fafc" font-family="monospace" font-size="6" text-anchor="middle" transform="rotate(-90 10 35)">K3 24V</text>
    </g>

    <!-- 5. PLC Compact CPU & I/O Module -->
    <g transform="translate(330, 36)">
      <rect x="0" y="0" width="180" height="75" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
      <text x="90" y="18" fill="#5eead4" font-family="'Segoe UI', monospace" font-size="9" font-weight="700" text-anchor="middle">PROGRAMMABLE LOGIC CONTROLLER</text>
      <text x="90" y="30" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">CPU &bull; DI / DQ / AI CHANNELS</text>
      <!-- PROFINET port -->
      <rect x="15" y="40" width="24" height="24" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="27" y="55" fill="#ffffff" font-family="monospace" font-size="6" text-anchor="middle">ETH</text>
      <!-- LED indicators -->
      <circle cx="55" cy="46" r="3" fill="#10b981"/>
      <text x="65" y="49" fill="#e2e8f0" font-family="monospace" font-size="6">RUN</text>
      <circle cx="55" cy="58" r="3" fill="#ef4444"/>
      <text x="65" y="61" fill="#e2e8f0" font-family="monospace" font-size="6">ERR</text>
      <!-- Terminal pins -->
      <path d="M 95 42 H 170 M 95 50 H 170 M 95 58 H 170" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Bottom DIN Rail: Terminal Blocks (Phoenix / Weidmuller style) -->
    <rect x="15" y="130" width="500" height="8" fill="#64748b" stroke="#94a3b8" stroke-width="0.5"/>
    <g transform="translate(25, 145)">
      <!-- Wire Ducts & Terminal blocks -->
      <rect x="0" y="0" width="480" height="40" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <!-- Block segments -->
      <path d="M 40 0 V 40 M 80 0 V 40 M 120 0 V 40 M 160 0 V 40 M 200 0 V 40 M 240 0 V 40 M 280 0 V 40 M 320 0 V 40 M 360 0 V 40 M 400 0 V 40 M 440 0 V 40" stroke="#475569" stroke-width="1"/>
      <text x="240" y="24" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="9" font-weight="600" text-anchor="middle">FIELD I/O &amp; POWER DISTRIBUTION TERMINAL BLOCKS (TB-01 TO TB-40)</text>
    </g>

    <!-- Ferrule Wiring Traces -->
    <path d="M 54 107 V 145" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 120 107 V 145" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 197 112 V 145" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="305" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11" text-anchor="middle">
    Panel Design &bull; DIN Rail Layout &bull; Ferruled Wiring &bull; Relay Logic &bull; Solapur, Maharashtra (2025)
  </text>
</svg>
