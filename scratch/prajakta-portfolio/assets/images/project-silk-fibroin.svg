<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="sfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#sfBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="600" height="360" rx="12" fill="url(#sfGrid)" opacity="0.4" />

  <!-- Badge -->
  <rect x="25" y="20" width="260" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="37" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">BIOMATERIAL MEMBRANE RESEARCH</text>
  <circle cx="270" cy="33" r="4" fill="#10b981"/>

  <!-- Stage 1: Raw Silk Fibroin / Degumming Process -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="140" height="195" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="70" y="25" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Extraction</text>
    <text x="70" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Bombyx mori Silkworm</text>

    <!-- Silk Cocoon / Fibers Illustration -->
    <ellipse cx="70" cy="85" rx="36" ry="24" fill="#334155" stroke="#f1f5f9" stroke-width="1.5"/>
    <path d="M 45 80 Q 70 70, 95 80 M 50 90 Q 70 100, 90 90" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    
    <!-- Degumming tag -->
    <rect x="15" y="125" width="110" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="70" y="139" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Na2CO3 Degumming</text>
    <rect x="15" y="155" width="110" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="70" y="169" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">Sericin Removal</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 185 170 H 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Stage 2: Membrane Cross-linking / Structure -->
  <g transform="translate(225, 75)">
    <rect x="0" y="0" width="150" height="195" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="75" y="25" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Membrane Matrix</text>
    <text x="75" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Porous Microstructure</text>

    <!-- Microscopic Nanofiber Mesh -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="110" height="85" rx="6" fill="#0b1120" stroke="#06b6d4" stroke-width="1"/>
      <!-- Intertwined nanofiber network -->
      <path d="M 5 20 Q 35 40, 60 15 T 105 30" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M 10 50 Q 40 25, 75 60 T 100 45" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M 15 75 Q 55 45, 95 70" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.8"/>
      <circle cx="45" cy="35" r="3" fill="#f59e0b" opacity="0.9"/>
      <circle cx="80" cy="50" r="4" fill="#ef4444" opacity="0.9"/>
      <text x="55" y="78" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">Pore Size: &lt; 0.2 µm</text>
    </g>

    <!-- Crosslink Tag -->
    <rect x="15" y="155" width="120" height="22" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="75" y="169" fill="#34d399" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Eco-Friendly Matrix</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 385 170 H 420" stroke="#06b6d4" stroke-width="2" fill="none"/>

  <!-- Stage 3: Filtration Test Setup -->
  <g transform="translate(425, 75)">
    <rect x="0" y="0" width="140" height="195" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="25" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. Filtration Rig</text>
    <text x="70" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Heavy Metal &amp; Turbidity</text>

    <!-- Vacuum Funnel Setup -->
    <path d="M 35 60 L 105 60 L 80 100 L 80 145 L 60 145 L 60 100 Z" fill="#0c4a6e" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Membrane Layer -->
    <rect x="62" y="98" width="16" height="4" fill="#10b981"/>
    
    <!-- Droplets -->
    <circle cx="70" cy="120" r="2.5" fill="#38bdf8"/>
    <circle cx="70" cy="135" r="2.5" fill="#38bdf8"/>

    <!-- Results Box -->
    <rect x="15" y="155" width="110" height="26" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="167" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" text-anchor="middle">🏆 Best Oral Award</text>
    <text x="70" y="177" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">Int'l Conference</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="315" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11" text-anchor="middle">
    Biopolymer Extraction &bull; Microfiltration Membrane Synthesis &bull; Sustainable Water Treatment
  </text>
</svg>
