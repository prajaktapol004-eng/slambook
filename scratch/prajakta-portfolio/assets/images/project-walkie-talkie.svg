<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="wtGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#wtBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="600" height="360" rx="12" fill="url(#wtGrid)" opacity="0.4" />

  <!-- Badge -->
  <rect x="25" y="20" width="230" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="37" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">ENCRYPTED ESP-NOW AUDIO</text>
  <circle cx="240" cy="33" r="4" fill="#10b981"/>

  <!-- Node A (Transmitter Node) -->
  <g transform="translate(35, 65)">
    <rect x="0" y="0" width="180" height="210" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="24" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRANSCEIVER NODE A</text>

    <!-- I2S Microphone (INMP441) -->
    <rect x="20" y="40" width="140" height="40" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <circle cx="40" cy="60" r="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="40" cy="60" r="4" fill="#38bdf8"/>
    <text x="60" y="56" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">I2S Digital Mic</text>
    <text x="60" y="69" fill="#94a3b8" font-family="monospace" font-size="8">16-bit PCM Audio</text>

    <!-- ESP32 with AES Engine -->
    <rect x="20" y="95" width="140" height="90" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="115" fill="#34d399" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" text-anchor="middle">ESP32 Core Processing</text>
    
    <!-- AES Hardware Block -->
    <rect x="30" y="125" width="120" height="45" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="142" fill="#5eead4" font-family="'Segoe UI', monospace" font-size="9" font-weight="700" text-anchor="middle">AES-128 / CBC</text>
    <text x="90" y="157" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">Hardware Crypto Engine</text>
  </g>

  <!-- Wireless ESP-NOW RF Bridge (Center) -->
  <g transform="translate(225, 95)">
    <!-- RF Antenna Waves -->
    <circle cx="75" cy="50" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="75" cy="50" r="45" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="75" cy="50" r="65" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6 5"/>
    
    <!-- Lock Icon / Secure Stream -->
    <rect x="45" y="120" width="60" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="136" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ESP-NOW</text>
    <text x="75" y="146" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">2.4 GHz Peer</text>

    <!-- Encrypted Packet -->
    <rect x="40" y="165" width="70" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="179" fill="#fbbf24" font-family="monospace" font-size="8" text-anchor="middle">🔒 Encrypted Payloads</text>
  </g>

  <!-- Node B (Receiver Node) -->
  <g transform="translate(385, 65)">
    <rect x="0" y="0" width="180" height="210" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="90" y="24" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRANSCEIVER NODE B</text>

    <!-- ESP32 Decryption Block -->
    <rect x="20" y="40" width="140" height="85" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="60" fill="#34d399" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" text-anchor="middle">ESP32 Core RX</text>
    <rect x="30" y="70" width="120" height="40" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="87" fill="#5eead4" font-family="'Segoe UI', monospace" font-size="9" font-weight="700" text-anchor="middle">AES Decryption</text>
    <text x="90" y="100" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">Zero-Latency Decrypt</text>

    <!-- Audio Output / DAC Speaker -->
    <rect x="20" y="140" width="140" height="50" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <path d="M 35 165 L 45 155 H 55 L 65 145 V 185 L 55 175 H 45 Z" fill="#38bdf8"/>
    <path d="M 70 158 Q 75 165, 70 172" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 75 152 Q 83 165, 75 178" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="88" y="163" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">Audio Playback</text>
    <text x="88" y="176" fill="#94a3b8" font-family="monospace" font-size="8">Decrypted Voice</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="315" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11" text-anchor="middle">
    I2S Digital Sampling &bull; ESP-NOW Fast Connectionless MAC &bull; Hardware AES-128 Encryption
  </text>
</svg>
