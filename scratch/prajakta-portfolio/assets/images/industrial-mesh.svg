<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </linearGradient>
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1440" height="800" fill="url(#meshGrad)" />
  <rect width="1440" height="800" fill="url(#isoGrid)" />

  <!-- Industrial Buslines / Schematic Traces -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 0 120 H 450 L 520 190 H 980 L 1040 130 H 1440" />
    <path d="M 0 350 H 300 L 380 430 H 820 L 900 350 H 1440" />
    <path d="M 120 0 V 220 L 190 290 V 600 L 260 670 V 800" />
    <path d="M 1120 0 V 180 L 1060 240 V 550 L 1140 630 V 800" />
  </g>

  <!-- Glowing PCB Nodes -->
  <g fill="#06b6d4" fill-opacity="0.6">
    <circle cx="450" cy="120" r="4" />
    <circle cx="520" cy="190" r="4" />
    <circle cx="980" cy="190" r="4" />
    <circle cx="1040" cy="130" r="4" />
    <circle cx="300" cy="350" r="4" />
    <circle cx="820" cy="430" r="4" />
    <circle cx="190" cy="290" r="4" />
    <circle cx="1060" cy="240" r="4" />
  </g>
</svg>
